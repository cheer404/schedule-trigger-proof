name: AHUT scheduled fallback and chain repair
run-name: Fallback ${{ github.event.schedule || inputs.mode || 'manual' }}

on:
  schedule:
    # GitHub cron 使用 UTC：北京时间 21:37、21:52、22:07。
    - cron: "37 13 * * *"
    - cron: "52 13 * * *"
    - cron: "7 14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Probe validates configuration without contacting the target service
        required: true
        default: probe
        type: choice
        options:
          - probe
          - production

permissions: {}

jobs:
  arm-next-day:
    if: ${{ github.event_name == 'schedule' || inputs.mode == 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out scheduler
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Ensure tomorrow is prequeued
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          next_target="$(date -u -d 'tomorrow 13:35:00 UTC' +'%Y-%m-%dT%H:%M:%SZ')"
          bash .github/scripts/ensure-prequeued.sh \
            "$next_target" daily-queue "$WORKFLOW_REF" 1425

  run-application:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {}
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Restore private application bundle
        shell: bash
        env:
          APP_BUNDLE_B64: ${{ secrets.APP_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          test -n "$APP_BUNDLE_B64"
          install -d -m 700 "$RUNNER_TEMP/private-app"
          printf '%s' "$APP_BUNDLE_B64" | base64 --decode > "$RUNNER_TEMP/app.tar.gz"
          tar -xzf "$RUNNER_TEMP/app.tar.gz" -C "$RUNNER_TEMP/private-app"
          test -f "$RUNNER_TEMP/private-app/main.py"
          test -f "$RUNNER_TEMP/private-app/requirements.txt"

      - name: Install dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r "$RUNNER_TEMP/private-app/requirements.txt"

      - name: Validate single-user configuration
        shell: bash
        env:
          AHUT_USERS_JSON: ${{ secrets.AHUT_USERS_JSON }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os

          def normalize_student_id(value):
              if isinstance(value, bool):
                  raise AssertionError
              if isinstance(value, int):
                  student_id = value
              elif isinstance(value, str) and value.strip().isdigit():
                  student_id = int(value.strip())
              else:
                  raise AssertionError
              if student_id <= 0:
                  raise AssertionError
              return student_id

          users = json.loads(os.environ["AHUT_USERS_JSON"])
          assert isinstance(users, list) and users
          assert all(isinstance(user, dict) for user in users)
          assert all(
              isinstance(user.get("password"), str) and user["password"]
              for user in users
          )
          student_ids = [
              normalize_student_id(user.get("student_id")) for user in users
          ]
          assert len(student_ids) == 1
          PY

      - name: Probe application bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'probe' }}
        shell: bash
        run: |
          python -m py_compile "$RUNNER_TEMP/private-app/main.py"
          echo "FALLBACK_PRIVATE_BUNDLE_PROBE_OK"

      - name: Run private application without public personal logs
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'production' }}
        shell: bash
        env:
          AHUT_USERS_JSON: ${{ secrets.AHUT_USERS_JSON }}
        run: |
          set -euo pipefail
          private_log="$RUNNER_TEMP/private-app.log"
          trap 'rm -f -- "$private_log"' EXIT
          cd "$RUNNER_TEMP/private-app"

          if python main.py >"$private_log" 2>&1; then
            echo "FALLBACK_PRIVATE_APPLICATION_COMPLETED_OK"
            exit 0
          fi

          echo "::warning::First attempt failed; retrying in ten minutes."
          sleep 600
          if python main.py >"$private_log" 2>&1; then
            echo "FALLBACK_PRIVATE_APPLICATION_RETRY_COMPLETED_OK"
          else
            echo "::error::Private application failed twice; personal output is intentionally withheld."
            exit 1
          fi
